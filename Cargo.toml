[package]
name = "odyssey-ctl"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Control Samsung Odyssey monitors over DDC/CI: picture, game and lighting settings, presets, CLI and GUI"
license = "MIT"
authors = ["deddroid <deddo9412@gmail.com>"]
repository = "https://github.com/deddroid/odyssey-ctl"
readme = "README.md"
keywords = ["monitor", "samsung", "odyssey", "ddc", "mccs"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = { version = "7.0.0", optional = true }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
interprocess = { version = "2", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = "2.0.21"
toml = { version = "1.2.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true }
libc = "0.2.191"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"], optional = true }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26", optional = true }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"], optional = true }
winreg = { version = "0.56", optional = true }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[features]
default = ["gui"]
gui = [
    "dep:eframe",
    "dep:serde",
    "dep:toml",
    "dep:dirs",
    "dep:image",
    "dep:interprocess",
    "dep:ksni",
    "dep:tokio",
    "dep:tray-icon",
    "dep:windows-sys",
    "dep:winreg",
]

[[bin]]
name = "odyssey-ctl"
path = "src/main.rs"

[[bin]]
name = "odyssey-ctl-gui"
path = "src/gui/main.rs"
required-features = ["gui"]
