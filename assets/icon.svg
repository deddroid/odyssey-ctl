<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e74ff"/>
      <stop offset="1" stop-color="#5a3fd6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1f2a"/>
      <stop offset="1" stop-color="#12131a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- monitor -->
  <rect x="40" y="58" width="176" height="110" rx="14" fill="url(#screen)"/>
  <rect x="52" y="70" width="152" height="86" rx="8" fill="none" stroke="#7c5cff" stroke-width="3" opacity="0.55"/>
  <!-- stand -->
  <rect x="112" y="170" width="32" height="18" rx="4" fill="#12131a"/>
  <rect x="76" y="188" width="104" height="14" rx="7" fill="#12131a"/>
  <!-- aim point / dial glyph on screen -->
  <circle cx="128" cy="113" r="26" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-dasharray="122 42" transform="rotate(-90 128 113)"/>
  <circle cx="128" cy="113" r="7" fill="#ffffff"/>
</svg>
